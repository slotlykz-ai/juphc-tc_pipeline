apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        rm -rf "$(workspaces.source.path)"/* "$(workspaces.source.path)"/.[!.]* || true
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
spec:
  description: Install Node.js dependencies.
  workspaces:
    - name: source
  steps:
    - name: install
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npm install
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  description: Run the Jasmine unit tests.
  workspaces:
    - name: source
  steps:
    - name: test
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npx jasmine
